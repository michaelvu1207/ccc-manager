[project]
name = "cccswitcher"
version = "0.1.0"
description = "Combined Claude (cswap) + Codex (codex-auth) account list, live usage, and monthly cost via ccusage"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ccc = "cccswitcher.cli:main"
cccswitcher = "cccswitcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cccswitcher"]
