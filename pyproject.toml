[project]
name = "cccswitcher"
version = "0.16.0"
description = "A pretty terminal dashboard for switching between Claude Code and Codex accounts, with live usage and spend."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Vu" }]
keywords = ["claude", "codex", "tui", "account-switcher", "usage", "cli"]
dependencies = []

[project.urls]
Homepage = "https://github.com/michaelvu1207/cccswitcher"
Repository = "https://github.com/michaelvu1207/cccswitcher"
Issues = "https://github.com/michaelvu1207/cccswitcher/issues"

[project.scripts]
ccc = "cccswitcher.cli:main"
cccswitcher = "cccswitcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cccswitcher"]
artifacts = ["cccswitcher/assets/*.png", "cccswitcher/assets/*.txt"]
