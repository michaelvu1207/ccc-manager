name: CCC
options:
  bundleIdPrefix: dev.maikyon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  CCC:
    type: application
    platform: macOS
    sources:
      - CCC
      - path: ../assets/ccc-banner-light.png
        buildPhase: resources
      - path: ../assets/ccc-banner-dark.png
        buildPhase: resources
    info:
      path: CCC/Info.plist
      properties:
        CFBundleDisplayName: CCC Manager
        CFBundleShortVersionString: "0.17.0"
        CFBundleVersion: "17"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maikyon.ccc
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_APP_SANDBOX: false
  CCCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CCCTests
    dependencies:
      - target: CCC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
